# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/"
    schedule:
      interval: "daily"
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "*"
        # Only allow updates for minor and major versions; ignore semver patch versions.
        update-types: ["version-update:semver-patch"]
      # TypeScript 7 is the new native (Go) compiler, which does not yet
      # expose the programmatic API that `astro check` (via
      # `@astrojs/language-server`) and `typescript-eslint` depend on. Stay on
      # the 6.x line until that tooling supports the native compiler, then
      # remove this ignore.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Keep the GitHub Actions used by the workflows current so they do not fall
  # behind and start emitting Node.js runtime deprecation warnings.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
